[project]
name = "entrenador-ax"
version = "0.2.0"
description = "EntrenadorAX - Agente deportivo integral en Telegram con OpenAI Agents SDK"
requires-python = ">=3.11"
dependencies = [
    "openai-agents[redis]>=0.14",
    "python-telegram-bot[job-queue]>=22.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
