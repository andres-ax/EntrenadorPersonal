[build]
  builder = "DOCKERFILE"
  dockerfilePath = "Dockerfile"

[deploy]
  # start.sh ejecuta `alembic upgrade head` y luego arranca uvicorn.
  # Mas robusto que `sh -c "..."` porque evita problemas de quoting en Railway.
  startCommand = "./start.sh"
  healthcheckPath = "/health"
  # 300s: da margen al primer arranque (alembic + lifespan + JobQueue init).
  # En arranques warm baja a <10s.
  healthcheckTimeout = 300
  restartPolicyType = "ON_FAILURE"

[service]
  port = 8080
