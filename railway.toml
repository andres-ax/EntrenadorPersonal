[build]
  builder = "DOCKERFILE"
  dockerfilePath = "Dockerfile"

[deploy]
  # Shell wrapper (sh -c) para expandir $PORT que Railway inyecta.
  # alembic upgrade head ANTES de arrancar uvicorn para que el schema este al dia.
  startCommand = "sh -c 'alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port ${PORT:-8080}'"
  healthcheckPath = "/health"
  healthcheckTimeout = 60
  restartPolicyType = "ON_FAILURE"

[service]
  port = 8080
