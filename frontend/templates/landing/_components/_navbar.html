{# Navbar publico de la landing. Variable `active` selecciona link resaltado. #}
<header class="bg-white border-b border-slate-200 sticky top-0 z-50">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
    <a href="/" class="flex items-center gap-2">
      <span class="text-xl font-bold text-slate-900">EntrenadorAX</span>
      <span class="text-xs px-2 py-0.5 rounded-full bg-brand-100 text-brand-700">Beta CO</span>
    </a>
    <nav class="hidden md:flex items-center gap-6 text-sm">
      <a href="/" class="{% if active == 'home' %}text-brand-600 font-medium{% else %}text-slate-600 hover:text-slate-900{% endif %}">Inicio</a>
      <a href="/deportes" class="{% if active == 'deportes' %}text-brand-600 font-medium{% else %}text-slate-600 hover:text-slate-900{% endif %}">Deportes</a>
      <a href="/precios" class="{% if active == 'precios' %}text-brand-600 font-medium{% else %}text-slate-600 hover:text-slate-900{% endif %}">Precios</a>
      <a href="https://t.me/EntrenadorAX_bot" target="_blank" rel="noopener"
         class="bg-brand-600 hover:bg-brand-700 text-white font-semibold px-4 py-2 rounded-lg">
        Empezar gratis
      </a>
    </nav>
    <a href="https://t.me/EntrenadorAX_bot" target="_blank" rel="noopener"
       class="md:hidden bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold px-3 py-1.5 rounded-lg">
      Probar
    </a>
  </div>
</header>
