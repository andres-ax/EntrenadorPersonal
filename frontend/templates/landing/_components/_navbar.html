{# Navbar publico de la landing. Variable `active` selecciona link resaltado. #}
<header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
    <a href="/" class="flex items-center gap-2">
      <img src="/static/img/favicon.svg" alt="" class="w-8 h-8" />
      <span class="text-xl font-bold text-slate-900">EntrenadorAX</span>
      <span class="text-xs px-2 py-0.5 rounded-full bg-brand-100 text-brand-700 hidden sm:inline">Beta CO</span>
    </a>

    {# Desktop nav #}
    <nav class="hidden md:flex items-center gap-6 text-sm">
      <a href="/" class="{% if active == 'home' %}text-brand-600 font-medium{% else %}text-slate-600 hover:text-slate-900{% endif %}">Inicio</a>
      <a href="/deportes" class="{% if active == 'deportes' %}text-brand-600 font-medium{% else %}text-slate-600 hover:text-slate-900{% endif %}">Deportes</a>
      <a href="/precios" class="{% if active == 'precios' %}text-brand-600 font-medium{% else %}text-slate-600 hover:text-slate-900{% endif %}">Precios</a>
      <a href="/login" class="{% if active == 'login' %}text-brand-600 font-medium{% else %}text-slate-600 hover:text-slate-900{% endif %}">Iniciar sesion</a>
      <a href="https://t.me/EntrenadorAX_bot" target="_blank" rel="noopener"
         class="bg-brand-600 hover:bg-brand-700 text-white font-semibold px-4 py-2 rounded-lg shadow-sm hover:shadow-md">
        Empezar gratis
      </a>
    </nav>

    {# Mobile hamburger #}
    <button id="nav-toggle" class="md:hidden p-2 rounded-lg hover:bg-slate-100" aria-label="Menu" aria-expanded="false">
      <svg id="nav-icon-open" class="w-6 h-6 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
      <svg id="nav-icon-close" class="w-6 h-6 text-slate-700 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  {# Mobile drawer #}
  <div id="mobile-menu" class="hidden md:hidden border-t border-slate-200 bg-white animate-slide-up">
    <nav class="max-w-6xl mx-auto px-4 py-4 space-y-2">
      <a href="/" class="block px-3 py-2.5 rounded-lg text-sm font-medium {% if active == 'home' %}bg-brand-50 text-brand-700{% else %}text-slate-700 hover:bg-slate-50{% endif %}">Inicio</a>
      <a href="/deportes" class="block px-3 py-2.5 rounded-lg text-sm font-medium {% if active == 'deportes' %}bg-brand-50 text-brand-700{% else %}text-slate-700 hover:bg-slate-50{% endif %}">Deportes (71)</a>
      <a href="/precios" class="block px-3 py-2.5 rounded-lg text-sm font-medium {% if active == 'precios' %}bg-brand-50 text-brand-700{% else %}text-slate-700 hover:bg-slate-50{% endif %}">Precios</a>
      <a href="/login" class="block px-3 py-2.5 rounded-lg text-sm font-medium {% if active == 'login' %}bg-brand-50 text-brand-700{% else %}text-slate-700 hover:bg-slate-50{% endif %}">Iniciar sesion</a>
      <div class="pt-2 border-t border-slate-100">
        <a href="https://t.me/EntrenadorAX_bot" target="_blank" rel="noopener"
           class="block w-full text-center bg-brand-600 hover:bg-brand-700 text-white font-semibold px-4 py-3 rounded-lg shadow-sm">
          Empezar gratis en Telegram
        </a>
      </div>
    </nav>
  </div>
</header>

<script>
(function(){
  var btn = document.getElementById('nav-toggle');
  var menu = document.getElementById('mobile-menu');
  var iconOpen = document.getElementById('nav-icon-open');
  var iconClose = document.getElementById('nav-icon-close');
  btn.addEventListener('click', function(){
    var open = !menu.classList.contains('hidden');
    menu.classList.toggle('hidden', open);
    iconOpen.classList.toggle('hidden', !open);
    iconClose.classList.toggle('hidden', open);
    btn.setAttribute('aria-expanded', !open);
  });
  document.addEventListener('click', function(e){
    if (!btn.contains(e.target) && !menu.contains(e.target)) {
      menu.classList.add('hidden');
      iconOpen.classList.remove('hidden');
      iconClose.classList.add('hidden');
      btn.setAttribute('aria-expanded', 'false');
    }
  });
})();
</script>
