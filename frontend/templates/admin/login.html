{% extends "base.html" %}

{% block title %}EntrenadorAX Admin - Login{% endblock %}

{% block body %}
<div class="min-h-screen flex items-center justify-center bg-slate-900 px-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
    <h1 class="text-2xl font-bold text-slate-800 mb-1">EntrenadorAX Admin</h1>
    <p class="text-sm text-slate-500 mb-6">Acceso restringido. Usa tu cuenta de admin.</p>
    {% if error %}
      <div class="mb-4 p-3 rounded-lg bg-rose-50 text-rose-700 text-sm">{{ error }}</div>
    {% endif %}
    <form method="post" action="/admin/login" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="email">Email</label>
        <input type="email" name="email" id="email" required autofocus
               value="{{ email_prefill|default('') }}"
               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="password">Contrasena</label>
        <input type="password" name="password" id="password" required
               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500" />
      </div>
      <button type="submit"
              class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-2 rounded-lg transition">
        Ingresar
      </button>
    </form>
    <p class="text-xs text-slate-400 mt-4 text-center">
      <a href="/" class="hover:text-slate-600">Volver al sitio</a>
    </p>
  </div>
</div>
{% endblock %}
