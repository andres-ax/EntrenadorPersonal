<nav class="bg-white border-t border-slate-200 grid grid-cols-5 text-xs sticky bottom-0">
  {% set items = [
    ("dashboard", "/app/dashboard", "Hoy"),
    ("calendario", "/app/calendario", "Calend"),
    ("plan", "/app/plan", "Plan"),
    ("prs", "/app/prs", "PRs"),
    ("llamar", "/app/llamar", "Llamar"),
  ] %}
  {% for key, url, label in items %}
    <a href="{{ url }}"
       class="py-3 text-center {% if active == key %}text-brand-600 font-semibold{% else %}text-slate-500 hover:text-slate-900{% endif %}">
      {{ label }}
    </a>
  {% endfor %}
</nav>
